name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Do NOT use android-actions/setup-android: it failed on the runner
      # with 'Failed to find package tools'. ubuntu-latest runners already
      # ship a preinstalled Android SDK, so Gradle uses ANDROID_HOME as is.
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true

      - name: Download Arabic font (not stored in the repo)
        run: |
          mkdir -p app/src/main/assets/fonts
          curl -L -o app/src/main/assets/fonts/NotoNaskhArabic-Regular.ttf \
            "https://github.com/notofonts/Noto-Fonts/raw/main/hinted/ttf/NotoNaskhArabic/NotoNaskhArabic-Regular.ttf" \
          || curl -L -o app/src/main/assets/fonts/NotoNaskhArabic-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf"
          ls -lh app/src/main/assets/fonts/

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTranslator-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
